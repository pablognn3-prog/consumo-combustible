<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MI RUTA - Consumo</title>
<meta name="theme-color" content="#facc15">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23facc15'/><text x='50' y='68' font-size='55' text-anchor='middle'>⛽</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23facc15'/><text x='50' y='68' font-size='55' text-anchor='middle'>⛽</text></svg>">
<link rel="manifest" href='data:application/manifest+json,{"name":"MI RUTA - Consumo","short_name":"Consumo","display":"standalone","background_color":"%23d1d5db","theme_color":"%23facc15","icons":[{"src":"data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><circle cx=%2750%27 cy=%2750%27 r=%2748%27 fill=%27%23facc15%27/><text x=%2750%27 y=%2768%27 font-size=%2755%27 text-anchor=%27middle%27>⛽</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
body{font-family:Arial,sans-serif;background:#d1d5db;color:#111827;margin:0;padding:16px}
.logo{text-align:center;margin:5px 0 15px}
.logo span{display:inline-block;background:#facc15;width:80px;height:80px;line-height:80px;border-radius:50%;font-size:45px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
h1{text-align:center;margin:5px 0 0;font-size:24px}
p.sub{text-align:center;margin:2px 0 15px;color:#4b5563}
.card{background:#ffffff;padding:16px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #d1d5db;box-sizing:border-box;font-size:16px;background:#f9fafb}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#facc15;color:#000;font-weight:bold;font-size:17px;cursor:pointer}
.resumen{display:flex;gap:10px;text-align:center}
.resumen div{flex:1;background:#f3f4f6;padding:10px;border-radius:10px}
.resumen b{font-size:20px;color:#16a34a;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}
.del{background:#ef4444;color:#fff;padding:6px 10px;width:auto;font-size:13px}
</style>
</head>
<body>
<div class="logo"><span>⛽</span></div>
<h1>MI RUTA - Consumo</h1>
<p class="sub">Control de combustible</p>
<div class="card">
<h3 style="margin:0 0 10px">Nueva Carga</h3>
<input type="date" id="fecha">
<input type="number" id="km" placeholder="KM actuales Ej: 152300">
<input type="number" id="litros" placeholder="Litros Ej: 35" step="0.01">
<input type="number" id="precio" placeholder="Precio por litro Ej: 1450" step="0.01">
<button onclick="guardar()">GUARDAR CARGA</button>
<p id="msg" style="text-align:center"></p>
</div>
<div class="card resumen">
<div><span>Promedio Km/L</span><b id="prom">-</b></div>
<div><span>Gasto Total</span><b id="total">$0</b></div>
<div><span>Cargas</span><b id="cant">0</b></div>
</div>
<div class="card">
<h3 style="margin:0 0 10px">Historial</h3>
<table><thead><tr><th>Fecha</th><th>KM</th><th>Litros</th><th>$ / L</th><th></th></tr></thead><tbody id="lista"></tbody></table>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBtE7xSCMKB5jgW3yXv7fwAEVvLDW4RLlw",
  authDomain: "mi-ruta-eb2c3.firebaseapp.com",
  projectId: "mi-ruta-eb2c3",
  storageBucket: "mi-ruta-eb2c3.firebasestorage.app",
  messagingSenderId: "252338478970",
  appId: "1:252338478970:web:9fc6aabbd0fcb0d0bdc0c3",
  measurementId: "G-1FSD6BBM3V"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
document.getElementById('fecha').valueAsDate = new Date();
async function guardar(){
  const fecha=document.getElementById('fecha').value;
  const km=parseFloat(document.getElementById('km').value);
  const litros=parseFloat(document.getElementById('litros').value);
  const precio=parseFloat(document.getElementById('precio').value);
  if(!fecha||!km||!litros||!precio){alert('Completá todo');return;}
  await db.collection('consumo').add({fecha,km,litros,precio,total:litros*precio,creado:Date.now()});
  document.getElementById('msg').innerText='✅ Guardado!';
  document.getElementById('km').value='';document.getElementById('litros').value='';document.getElementById('precio').value='';
  cargar();
}
async function cargar(){
  const snap=await db.collection('consumo').orderBy('creado','desc').get();
  let html='', total=0, litrosTot=0, primero=null, ultimo=null;
  let arr=[];
  snap.forEach(d=>{arr.push({id:d.id,...d.data()})});
  arr.reverse();
  arr.forEach((r)=>{ total+=r.total||0; litrosTot+=r.litros; });
  if(arr.length>0){ primero=arr[0].km; ultimo=arr[arr.length-1].km; }
  arr.reverse();
  arr.forEach(r=>{ html+=`<tr><td>${r.fecha}</td><td>${r.km}</td><td>${r.litros}</td><td>$${r.precio}</td><td><button class="del" onclick="borrar('${r.id}')">X</button></td></tr>`; });
  document.getElementById('lista').innerHTML=html||'<tr><td colspan=5>Sin cargas todavía</td></tr>';
  document.getElementById('total').innerText='$'+total.toLocaleString('es-AR');
  document.getElementById('cant').innerText=arr.length;
  if(arr.length>1){
    let kmRecorridos=ultimo-primero;
    let litrosConsumidos=litrosTot-arr[arr.length-1].litros;
    if(litrosConsumidos>0) document.getElementById('prom').innerText=(kmRecorridos/litrosConsumidos).toFixed(2);
  }
}
async function borrar(id){ if(confirm('¿Borrar?')){ await db.collection('consumo').doc(id).delete(); cargar(); } }
cargar();
</script>
</body>
</html>
