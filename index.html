<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MI RUTA</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f2f4f7;margin:0;padding:16px;color:#111}
.card{background:#fff;border-radius:16px;padding:18px;max-width:480px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1{text-align:center;margin:6px 0 2px}
p.sub{text-align:center;color:#666;margin:0 0 16px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;cursor:pointer;margin-top:10px}
button.google{background:#fff;color:#111;border:1px solid #ddd}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-top:8px;box-sizing:border-box;font-size:16px}
.hidden{display:none}
.item{background:#f7f8fa;border-radius:12px;padding:10px;margin-top:8px;font-size:14px}
.small{font-size:13px;color:#666;text-align:center;margin-top:10px}
#msg{color:#c00;text-align:center;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>MI RUTA</h1>
  <p class="sub">Control de consumo</p>

  <div id="loginBox">
    <button class="google" id="btnGoogle">Entrar con Google</button>
    <div id="msg"></div>
    <p class="small">Si se abre una ventana blanca, volvé acá y apretá de nuevo.</p>
  </div>

  <div id="appBox" class="hidden">
    <p id="userName" style="text-align:center"></p>
    <input id="km" type="number" placeholder="Km recorridos Ej: 120">
    <input id="litros" type="number" placeholder="Litros cargados Ej: 10">
    <input id="precio" type="number" placeholder="Precio por litro Ej: 1300 (opcional)">
    <button id="btnGuardar">Guardar viaje</button>
    <div id="lista"></div>
    <button id="btnSalir" style="background:#eee;color:#111">Salir</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // CONFIG NUEVA - MI RUTA CONSUMO
  const firebaseConfig = {
    apiKey: "AIzaSyBtE7xSCMKB5jgW3yXv7fwAEVvLDW4RLlw",
    authDomain: "mi-ruta-eb2c3.firebaseapp.com",
    projectId: "mi-ruta-eb2c3",
    storageBucket: "mi-ruta-eb2c3.firebasestorage.app",
    messagingSenderId: "252338478970",
    appId: "1:252338478970:web:9fc6aabbd0fcb0d0bdc0c3",
    measurementId: "G-1FSD6BBM3V"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const provider = new firebase.auth.GoogleAuthProvider();

  const loginBox = document.getElementById('loginBox');
  const appBox = document.getElementById('appBox');
  const msg = document.getElementById('msg');

  document.getElementById('btnGoogle').onclick = async () => {
    msg.textContent = "";
    try {
      await auth.signInWithPopup(provider);
    } catch(e) {
      // Si el celu bloquea el popup, usa redirect
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
        await auth.signInWithRedirect(provider);
      } else {
        msg.textContent = "Error: " + e.message;
      }
    }
  };

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      loginBox.classList.add('hidden');
      appBox.classList.remove('hidden');
      document.getElementById('userName').textContent = "Hola, " + (user.displayName || user.email);
      cargar();
    } else {
      loginBox.classList.remove('hidden');
      appBox.classList.add('hidden');
    }
  });

  // Revisar si viene de redirect
  auth.getRedirectResult().catch(e => {
    if(e && e.code) msg.textContent = "Error: " + e.message;
  });

  document.getElementById('btnGuardar').onclick = async () => {
    const km = parseFloat(document.getElementById('km').value);
    const litros = parseFloat(document.getElementById('litros').value);
    const precio = parseFloat(document.getElementById('precio').value) || 0;
    if(!km || !litros){ alert("Poné km y litros"); return; }
    const consumo = (litros / km * 100).toFixed(2);
    await db.collection('viajes').add({
      uid: auth.currentUser.uid,
      km, litros, precio, consumo: parseFloat(consumo),
      fecha: new Date()
    });
    document.getElementById('km').value="";
    document.getElementById('litros').value="";
    document.getElementById('precio').value="";
    cargar();
  };

  async function cargar(){
    const snap = await db.collection('viajes').where('uid','==',auth.currentUser.uid).orderBy('fecha','desc').limit(20).get();
    let html = "";
    snap.forEach(d=>{
      const v = d.data();
      html += `<div class="item"><b>${v.km} km</b> - ${v.litros} L - <b>${v.consumo} L/100km</b>${v.precio?` - $${(v.precio*v.litros).toFixed(0)}`:''}</div>`;
    });
    document.getElementById('lista').innerHTML = html || "<p class='small'>Todavía no hay viajes</p>";
  }

  document.getElementById('btnSalir').onclick = () => auth.signOut();
</script>
</body>
</html>
